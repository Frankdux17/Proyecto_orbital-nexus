{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Crear cuenta</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nombre
      <input type="text" name="name" value="{{ form.name }}" maxlength="60" autocomplete="name" required autofocus>
    </label>
    <label>Correo
      <input type="email" name="email" value="{{ form.email }}" maxlength="120" autocomplete="email" required>
    </label>
    <label>Contraseña <small>mínimo 8 caracteres</small>
      <input type="password" name="password" minlength="8" autocomplete="new-password" required>
    </label>
    <label>Repite la contraseña
      <input type="password" name="confirm" minlength="8" autocomplete="new-password" required>
    </label>
    <button class="btn primary" type="submit">Crear cuenta</button>
  </form>
  <p class="hint">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Iniciar sesión</a></p>
</section>
{% endblock %}
