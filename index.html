<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Nexus</title>
<meta name="description" content="Interactive space mission design simulator: trade mass, power, delta-v, data and budget, then operate your mission turn by turn.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta property="og:title" content="ORBITAL NEXUS — Engineering Beyond Earth">
<meta property="og:description" content="Design, launch and operate a space mission. NASA Space Apps Challenge project, in English and Spanish.">
<meta property="og:image" content="https://frankdux17.github.io/Proyecto_orbital-nexus/assets/img/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="assets/img/logo-mark.png" alt="" width="90" height="34">
    <div class="brand-text">
      <strong>ORBITAL NEXUS</strong>
      <span id="brand-sub">Simulador de diseño de misiones</span>
    </div>
  </div>

  <nav class="stepper" id="stepper" aria-label="Mission phases"></nav>

  <div class="topbar-right">
    <button class="lab-top" id="lab-top" type="button" data-act="lab" title="Laboratorio de ingeniería · Engineering lab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.8L14 9V3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="1.7"/></svg>
      <span id="lab-top-txt">Laboratorio</span>
    </button>
    <button class="icon-btn help-btn" type="button" data-act="tour" aria-label="Ayuda · Help" title="Cómo se juega · How to play">?</button>
    <button class="icon-btn" id="snd-toggle" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="snd-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="snd-off" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Change language">
      <span class="lang-opt" data-l="es">ES</span><span class="lang-sep">/</span><span class="lang-opt" data-l="en">EN</span>
    </button>
  </div>
</header>

<div id="hud" class="hud" hidden></div>

<main id="stage" class="stage"></main>

<footer class="navbar" id="navbar" hidden>
  <div class="nav-msgs" id="nav-msgs"></div>
  <div class="nav-btns">
    <button class="btn ghost" id="btn-back" type="button"></button>
    <button class="btn primary" id="btn-next" type="button"></button>
  </div>
</footer>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/fx.js"></script>
<script src="assets/js/viz.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/coach.js"></script>
<script src="assets/js/explorer.js"></script>
<script src="assets/js/ascent.js"></script>
<script src="assets/js/mission.js"></script>
<script src="assets/js/design.js"></script>
<script src="assets/js/lab.js"></script>
<script src="assets/js/help.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
