<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITAL NEXUS · Presentación</title>
<meta name="description" content="ORBITAL NEXUS — 7-slide demo for the NASA Space Apps Challenge, in Spanish and English.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta property="og:title" content="ORBITAL NEXUS — Presentación / Demo">
<meta property="og:image" content="https://frankdux17.github.io/Proyecto_orbital-nexus/assets/img/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--dark:#0A1128;--dark2:#101A3A;--light:#EEF2F8;--ink:#0A1128;--body-dark:#3D4A66;--muted:#A9B8D6;--cyan:#4FD1E0;--gold:#F0C24B;--line:#2A3A66;
  --h:'Space Grotesk',Arial,sans-serif;--b:'Inter',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dark);color:var(--light);font-family:var(--b);-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;display:block}
.deck{z-index:1}
body{overflow:hidden}
a{color:inherit}
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;padding:clamp(70px,9vh,110px) clamp(16px,6vw,110px) 96px;display:flex;flex-direction:column;gap:clamp(14px,2.4vh,26px);
  overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s;
  background:linear-gradient(180deg,rgba(10,17,40,.25),rgba(10,17,40,.55));justify-content:safe center}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.slide.prev{transform:translateX(-40px)}
.slide.alt{background:linear-gradient(160deg,rgba(16,26,58,.55),rgba(16,26,58,.8))}
.slide.light{background:linear-gradient(160deg,rgba(238,242,248,.97),rgba(221,230,244,.93));color:var(--ink)}
.slide.gold{background:linear-gradient(160deg,rgba(240,194,75,.97),rgba(232,178,60,.93));color:var(--ink)}
.slide > *{max-width:1700px;width:100%;margin-left:auto;margin-right:auto}
.eyebrow{font-family:var(--h);font-size:clamp(12px,1.25vw,20px);font-weight:600;letter-spacing:.14em;color:var(--cyan);margin:0}
.light .eyebrow{color:#0B7C8C} .gold .eyebrow{color:var(--ink)}
h1,h2,h3{font-family:var(--h);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(40px,6.4vw,104px);line-height:1}
h2{font-size:clamp(26px,3.6vw,60px);line-height:1.08}
h2.goal{font-size:clamp(24px,3vw,50px);line-height:1.18}
h3{font-size:clamp(17px,1.7vw,30px);line-height:1.2}
p{margin:0;font-size:clamp(15px,1.45vw,26px);line-height:1.45}
.lead{color:var(--muted)}
/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,70px);align-items:center;flex:1}
.cover-txt{display:flex;flex-direction:column;gap:clamp(12px,2vh,24px)}
.tagline{font-family:var(--h);font-size:clamp(22px,3vw,52px);font-weight:600;color:var(--cyan)}
.langs{display:flex;gap:10px;flex-wrap:wrap}
.lang{font-family:var(--h);font-weight:600;font-size:clamp(12px,1.1vw,18px);padding:6px 16px;border-radius:999px;border:2px solid var(--cyan);color:var(--cyan)}
.poster{width:100%;border-radius:20px;border:2px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);display:block}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:10px;font-family:var(--h);font-weight:700;font-size:clamp(15px,1.4vw,24px);padding:14px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--cyan),#7aa2ff);color:#04161c;text-decoration:none;box-shadow:0 14px 34px -14px var(--cyan)}
.play.ghost{background:transparent;color:var(--light);border:2px solid var(--line);box-shadow:none}
.gold .play{background:var(--ink);color:var(--gold)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,28px)}
.card{background:rgba(16,26,58,.78);backdrop-filter:blur(6px);border:2px solid var(--line);border-radius:20px;padding:clamp(16px,2vw,32px);display:flex;flex-direction:column;gap:10px}
.light .card{background:#FBFCFE;border-color:#CCD6E8}
.gold .card{background:#FFF6DC;border-color:#D9A82A}
.big{font-family:var(--h);font-size:clamp(46px,5.4vw,92px);font-weight:700;line-height:1;color:var(--cyan)}
.light .big{color:#0B7C8C}
.card .txt{color:var(--muted);font-size:clamp(14px,1.35vw,24px)}
.light .card .txt{color:var(--body-dark)} .gold .card .txt{color:#3A2E0A}
.quote{font-family:var(--h);font-size:clamp(20px,2.2vw,38px);font-weight:600;line-height:1.25;padding:clamp(14px,1.6vw,26px) clamp(16px,2vw,34px);border-left:8px solid var(--cyan);background:#DDE6F4;border-radius:12px;color:var(--ink)}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.step{font-family:var(--h);font-size:clamp(12px,1.25vw,22px);font-weight:600;padding:8px 16px;border-radius:999px;background:#16244F;border:2px solid var(--line)}
.step.hot{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.arrow{color:var(--muted)}
/* shots */
.row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(16px,3vw,50px);align-items:start}
.shot{width:100%;aspect-ratio:1366/900;object-fit:contain;background:#050914;border-radius:16px;border:2px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5);display:block;cursor:zoom-in}
.points{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,22px)}
.pt{display:flex;flex-direction:column;gap:4px;padding-left:20px;border-left:4px solid var(--cyan)}
.pt.gold-l{border-left-color:var(--gold)}
.pt p{color:var(--muted);font-size:clamp(14px,1.3vw,23px)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,56px)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,36px)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cap{font-size:clamp(14px,1.25vw,22px);color:var(--muted);line-height:1.4}
.cap b{color:var(--light)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:#16244F;border-radius:14px;padding:12px 14px}
.stat .n{font-family:var(--h);font-size:clamp(24px,2.6vw,44px);font-weight:700;color:var(--gold)}
.stat .l{font-size:clamp(12px,1.1vw,18px);color:var(--muted)}
.tech{font-size:clamp(13px,1.2vw,22px);color:#3A2E0A}
/* chrome */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(10px,3vw,40px);
  background:linear-gradient(transparent,rgba(5,9,20,.85) 40%)}
.light.on ~ .bar,.gold.on ~ .bar{background:linear-gradient(transparent,rgba(10,17,40,.7) 40%)}
.nav{display:flex;gap:8px;align-items:center}
.nb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(169,184,214,.4);background:rgba(16,26,58,.85);color:#fff;font-size:18px;cursor:pointer}
.nb:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(169,184,214,.45);cursor:pointer}
.dot.on{width:28px;border-radius:6px;background:var(--cyan)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px clamp(10px,3vw,40px);pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--h);font-weight:700;letter-spacing:.12em;font-size:14px;text-decoration:none;color:#fff;
  background:rgba(10,17,40,.7);padding:6px 12px 6px 6px;border-radius:999px;border:1px solid rgba(169,184,214,.3)}
.brand img{height:28px;border-radius:7px}
.tools{display:flex;gap:8px}
.tb{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(169,184,214,.35);background:rgba(10,17,40,.75);color:#fff;font-family:var(--h);font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tb.play-s{background:var(--cyan);color:#04161c;border-color:var(--cyan)}
.count{font-family:var(--h);font-size:14px;color:var(--muted);min-width:46px;text-align:right}
.hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);z-index:4;opacity:.8}
/* zoomed screenshot */
.zoom{position:fixed;inset:0;z-index:20;background:rgba(3,6,15,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
/* entrance */
.slide.on .rise{animation:rise .6s ease-out both;animation-delay:calc(var(--i,0) * 110ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide,.slide.on .rise{transition:none;animation:none}}
@media (max-width:860px){
  .cover,.row,.pair,.trio,.cards{grid-template-columns:1fr}
  .cover .poster{order:-1;max-width:560px}
  .hint{display:none}
  .tb .lbl{display:none}
}
@media (max-width:520px){
  .brand{font-size:0;gap:0;padding:4px}
  .brand img{height:30px}
  .tb{height:38px;padding:0 11px;white-space:nowrap;font-size:13px}
  .slide{padding-top:68px}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="deck" id="deck"></div>
<header class="top">
  <a class="brand" href="index.html"><img src="assets/img/logo-mark.png" alt="">ORBITAL NEXUS</a>
  <div class="tools">
    <button class="tb" id="lang" type="button" aria-label="Idioma · Language">ES / EN</button>
    <a class="tb" id="pdf" href="docs/ORBITAL-NEXUS-Presentacion-ES.pdf" download>⬇ <span class="lbl">PDF</span></a>
    <button class="tb" id="fs" type="button" aria-label="Pantalla completa · Fullscreen">⛶<span class="lbl" id="fs-lbl"></span></button>
    <a class="tb play-s" id="play-top" href="index.html">▶ <span class="lbl" id="play-lbl"></span></a>
  </div>
</header>
<footer class="bar">
  <div class="dots" id="dots"></div>
  <div class="nav"><span class="count" id="count"></span><button class="nb" id="prev" type="button" aria-label="Anterior · Previous">‹</button><button class="nb" id="next" type="button" aria-label="Siguiente · Next">›</button></div>
</footer>
<div class="hint" id="hint"></div>
<div class="zoom" id="zoom" hidden><img alt=""></div>

<script src="assets/js/space-bg.js"></script>
<script>
/* ORBITAL NEXUS — the 7-slide demo, public on the project site so anyone
   can see it without signing in anywhere. Same content as the presenter
   decks, in Spanish and English. */
var LANG = 'es';
try { LANG = new URLSearchParams(location.search).get('lang') || localStorage.getItem('on_lang') || ((navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es'); } catch (e) { }
if (LANG !== 'en') LANG = 'es';
var I = 0;

function T(es, en) { return LANG === 'es' ? es : en; }
function img(name, alt, i) { return '<img class="shot rise" style="--i:' + (i || 1) + '" src="assets/img/demo/' + LANG + '-' + name + '.jpg" alt="' + alt + '" loading="lazy">'; }

function slides() {
  var play = '<div class="cta-row rise" style="--i:3"><a class="play" href="index.html">▶ ' + T('Jugar ahora', 'Play now') + '</a><a class="play ghost" href="index.html#demo">' + T('Demo rápida en 1 clic', 'One-click quick demo') + '</a></div>';
  return [
  { cls: '', html:
    '<div class="cover"><div class="cover-txt">' +
    '<p class="eyebrow rise">NASA SPACE APPS CHALLENGE · ' + T('JUEGO DE DISEÑO DE MISIONES', 'MISSION DESIGN GAME') + '</p>' +
    '<h1 class="rise" style="--i:1">ORBITAL NEXUS</h1>' +
    '<p class="tagline rise" style="--i:1">' + T('Diseña. Lanza. Opera.', 'Design. Launch. Operate.') + '</p>' +
    '<p class="lead rise" style="--i:2">' + T('Un juego web donde los estudiantes viven una misión espacial completa, del concepto a la operación, con la física que usa un equipo real.',
      'A web game where students live a full space mission, from concept to operations, with the physics a real team uses.') + '</p>' +
    '<div class="langs rise" style="--i:2"><span class="lang">ES Español</span><span class="lang">EN English</span></div>' + play +
    '</div><img class="poster rise" style="--i:2" src="assets/img/hero.jpg" alt="' + T('Póster de ORBITAL NEXUS: Engineering Beyond Earth', 'ORBITAL NEXUS poster: Engineering Beyond Earth') + '"></div>' },

  { cls: 'light', html:
    '<p class="eyebrow rise">' + T('EL DESAFÍO', 'THE CHALLENGE') + '</p>' +
    '<h2 class="rise">' + T('Los compromisos de una misión son abstractos… hasta que los juegas', 'Mission trade-offs feel abstract… until you play them') + '</h2>' +
    '<div class="cards">' +
    '<div class="card rise" style="--i:1"><p class="big">6</p><h3>' + T('fases', 'phases') + '</h3><p class="txt">' + T('Misión, plataforma, ciencia, enlace, lanzamiento y operaciones, con un informe final.', 'Mission, spacecraft, science, link, launch and operations, plus a final report.') + '</p></div>' +
    '<div class="card rise" style="--i:2"><p class="big">11</p><h3>' + T('destinos', 'destinations') + '</h3><p class="txt">' + T('De la órbita baja y la Luna a Marte y Europa. Nuevos: Titán y el asteroide metálico Psyche.', 'From low Earth orbit and the Moon to Mars and Europa. New: Titan and the metal asteroid Psyche.') + '</p></div>' +
    '<div class="card rise" style="--i:3"><p class="big">3</p><h3>' + T('ecuaciones reales', 'real equations') + '</h3><p class="txt">' + T('La ecuación del cohete, la potencia solar por 1/r² y el presupuesto de enlace.', 'The rocket equation, solar power falling with 1/r², and the link budget.') + '</p></div></div>' +
    '<p class="quote rise" style="--i:4">' + T('“A los estudiantes no les falta información: les falta ver las consecuencias.”', '“Students don’t lack information: they can’t see the consequences.”') + '</p>' },

  { cls: '', html:
    '<p class="eyebrow rise">' + T('CÓMO FUNCIONA · ELEGIR ES FÁCIL', 'HOW IT WORKS · CHOOSING MADE EASY') + '</p>' +
    '<h2 class="rise">' + T('6 fases y un equipo que te ayuda', '6 phases and a team that helps you') + '</h2>' +
    '<div class="flow rise" style="--i:1">' + [T('1 Misión', '1 Mission'), T('2 Plataforma', '2 Spacecraft'), T('3 Ciencia', '3 Science'), T('4 Enlace', '4 Link'), T('5 Lanzamiento', '5 Launch'), T('6 Operaciones', '6 Operations')]
      .map(function (s, i) { return '<span class="step' + (i ? '' : ' hot') + '">' + s + '</span>'; }).join('<span class="arrow">→</span>') + '</div>' +
    '<div class="row">' + img('kits', T('Asistente con tres paquetes de nave y el anillo Estado de la misión al 100%', 'Assistant with three spacecraft packages and the Mission status ring at 100%'), 2) +
    '<div class="points">' +
    '<div class="pt rise" style="--i:2"><h3>' + T('Misiones listas y paquetes', 'Ready missions and packages') + '</h3><p>' + T('Toca «Equilibrada» y la nave queda dimensionada con la física real.', 'Tap “Balanced” and the spacecraft is sized with real physics.') + '</p></div>' +
    '<div class="pt rise" style="--i:3"><h3>' + T('Ves el efecto antes de elegir', 'See the effect before you choose') + '</h3><p>' + T('Cada opción muestra el costo y ✓ o ✕ en Δv, energía, carga y presupuesto.', 'Every option shows its cost and a ✓ or ✕ for Δv, power, payload and budget.') + '</p></div>' +
    '<div class="pt gold-l rise" style="--i:4"><h3>' + T('Estado de la misión', 'Mission status') + '</h3><p>' + T('Un anillo dice qué falta y lo arregla con «Arréglalo por mí».', 'A ring says what is missing and fixes it with “Fix it for me”.') + '</p></div>' +
    '<div class="pt rise" style="--i:5"><h3>' + T('Un experto en cada fase', 'An expert in every phase') + '</h3><p>' + T('Como en el Team X del JPL, y las palabras técnicas se explican al tocarlas.', 'Like JPL’s Team X, and technical words explain themselves when tapped.') + '</p></div>' +
    '</div></div>' },

  { cls: 'alt', html:
    '<p class="eyebrow rise">' + T('CENTRO DE CONTROL EN TIERRA', 'MISSION CONTROL ON THE GROUND') + '</p>' +
    '<h2 class="rise">' + T('Tú decides quién opera la misión', 'You decide who runs the mission') + '</h2>' +
    '<div class="row">' + img('staff', T('Panel del centro de control con las consolas FLIGHT, CAPCOM, FIDO, GNC, EECOM, INCO y SCI', 'Mission control panel with the FLIGHT, CAPCOM, FIDO, GNC, EECOM, INCO and SCI consoles'), 1) +
    '<div class="points">' +
    '<div class="pt rise" style="--i:2"><h3>' + T('7 consolas de la NASA', '7 NASA consoles') + '</h3><p>' + T('FLIGHT, CAPCOM, navegación FIDO, GNC, EECOM, INCO y ciencia. Cada puesto cuesta cada turno.', 'FLIGHT, CAPCOM, FIDO navigation, GNC, EECOM, INCO and science. Every seat costs money each turn.') + '</p></div>' +
    '<div class="pt gold-l rise" style="--i:3"><h3>' + T('17 fallas en vuelo', '17 in-flight failures') + '</h3><p>' + T('Basura espacial, pérdida de señal, error humano, tormenta solar… La consola correcta da una mejor solución.', 'Space debris, loss of signal, human error, solar storm… The right console offers a better fix.') + '</p></div>' +
    '<p class="cap rise" style="--i:4"><b>' + T('¿Cuántos navegantes?', 'How many navigators?') + '</b> ' + T('Naves que llegan al corredor:', 'Spacecraft that hit the corridor:') + '</p>' +
    '<div class="stat rise" style="--i:4"><div><p class="n">53%</p><p class="l">' + T('0 navegantes', '0 navigators') + '</p></div><div><p class="n">91%</p><p class="l">' + T('1 navegante', '1 navigator') + '</p></div><div><p class="n">~100%</p><p class="l">' + T('2 o más', '2 or more') + '</p></div></div>' +
    '</div></div>' },

  { cls: '', html:
    '<p class="eyebrow rise">' + T('LANZAMIENTO, VIAJE Y TITÁN', 'LAUNCH, JOURNEY AND TITAN') + '</p>' +
    '<h2 class="rise">' + T('Despega, viaja a Titán y vuela sobre sus dunas', 'Launch, travel to Titan and fly over its dunes') + '</h2>' +
    '<div class="trio">' +
    '<div class="col">' + img('ascent', T('Simulador de ascenso a 128 km de altura', 'Ascent simulator at 128 km altitude'), 1) + '<p class="cap rise" style="--i:1"><b>' + T('Despegue pilotado:', 'Piloted ascent:') + '</b> ' + T('tras el GO/NO-GO controlas el giro gravitatorio y Max-Q.', 'after GO/NO-GO you fly the gravity turn and Max-Q.') + '</p></div>' +
    '<div class="col">' + img('titan3d', T('Explorador 3D: viaje de la Tierra a Saturno y Titán', '3D explorer: journey from Earth to Saturn and Titan'), 2) + '<p class="cap rise" style="--i:2"><b>' + T('Explorador 3D:', '3D explorer:') + '</b> ' + T('el viaje real hasta Saturno y Titán, con correcciones y modo RV.', 'the real journey to Saturn and Titan, with corrections and a VR mode.') + '</p></div>' +
    '<div class="col">' + img('drone', T('Minijuego: dron sobre las dunas de Titán', 'Mini game: drone over Titan’s dunes'), 3) + '<p class="cap rise" style="--i:3"><b>' + T('Nuevo minijuego:', 'New mini game:') + '</b> ' + T('vuela un dron como Dragonfly y aterriza suave para tomar muestras.', 'fly a Dragonfly-style drone and land gently to take samples.') + '</p></div>' +
    '</div>' },

  { cls: 'alt', html:
    '<p class="eyebrow rise">' + T('LABORATORIO DE INGENIERÍA', 'ENGINEERING LAB') + '</p>' +
    '<h2 class="rise">' + T('Cálculos reales para científicos e ingenieros', 'Real calculations for scientists and engineers') + '</h2>' +
    '<div class="pair">' +
    '<div class="col">' + img('trade', T('Mapa de compensaciones: naves posibles por costo y probabilidad de éxito con la frontera de Pareto', 'Trade-space map: possible spacecraft by cost and chance of success with the Pareto front'), 1) +
    '<p class="cap rise" style="--i:1"><b>' + T('Mapa de compensaciones:', 'Trade-space map:') + '</b> ' + T('65 naves completas para tu misión, costo frente a éxito y frontera de Pareto. Se exporta a CSV.', '65 complete spacecraft for your mission, cost against success and the Pareto front. Exports to CSV.') + '</p></div>' +
    '<div class="col">' + img('hohmann', T('Transferencia de Hohmann de la Tierra a Marte: 5,6 km/s y 259 días', 'Hohmann transfer from Earth to Mars: 5.6 km/s and 259 days'), 2) +
    '<p class="cap rise" style="--i:2"><b>' + T('Seis herramientas', 'Six tools') + '</b> ' + T('con las ecuaciones a la vista: cohete, Hohmann y ventanas, órbita, enlace en dB y energía.', 'with the equations in view: rocket, Hohmann and windows, orbit, dB link budget and power.') + '</p></div>' +
    '</div>' },

  { cls: 'gold', html:
    '<p class="eyebrow rise">' + T('NUESTRA META', 'OUR GOAL') + '</p>' +
    '<h2 class="goal rise">' + T('Que cualquier estudiante piense como un equipo de diseño de misiones de la NASA en una sola partida, y que un ingeniero pueda comprobar cada número.',
      'Any student thinks like a NASA mission design team in a single game, and an engineer can check every number.') + '</h2>' +
    '<div class="cards">' +
    '<div class="card rise" style="--i:1"><h3>' + T('Ve las consecuencias', 'See the consequences') + '</h3><p class="txt">' + T('Cada opción muestra su efecto en masa, energía, Δv y presupuesto antes de elegirla.', 'Every option shows its effect on mass, power, Δv and budget before you pick it.') + '</p></div>' +
    '<div class="card rise" style="--i:2"><h3>' + T('Trabaja en equipo', 'Work as a team') + '</h3><p class="txt">' + T('El centro de control, la navegación y las fallas enseñan que a una misión la sostienen personas.', 'Mission control, navigation and failures teach that people keep a mission alive.') + '</p></div>' +
    '<div class="card rise" style="--i:3"><h3>' + T('Comprueba los números', 'Check the numbers') + '</h3><p class="txt">' + T('El laboratorio y el mapa de compensaciones usan las ecuaciones reales.', 'The lab and the trade-space map use the real equations.') + '</p></div></div>' +
    '<div class="cta-row rise" style="--i:4"><a class="play" href="index.html">▶ frankdux17.github.io/Proyecto_orbital-nexus</a></div>' +
    '<p class="tech rise" style="--i:5">' + T('Web, sin instalar · español e inglés · celular y PC · 11 destinos · comparte tu diseño por enlace · código abierto (MIT): ',
      'Web, nothing to install · English and Spanish · phone and PC · 11 destinations · share your design by link · open source (MIT): ') +
    '<a href="https://github.com/Frankdux17/Proyecto_orbital-nexus">github.com/Frankdux17/Proyecto_orbital-nexus</a></p>' }
  ];
}

function build() {
  document.documentElement.lang = LANG;
  document.title = 'ORBITAL NEXUS · ' + T('Presentación', 'Presentation');
  var S = slides(), deck = document.getElementById('deck'), dots = '';
  deck.innerHTML = S.map(function (s, i) {
    return '<section class="slide ' + s.cls + '" aria-roledescription="slide" aria-label="' + (i + 1) + ' / ' + S.length + '">' + s.html + '</section>';
  }).join('');
  for (var i = 0; i < S.length; i++) dots += '<button class="dot" type="button" data-i="' + i + '" aria-label="' + (i + 1) + '"></button>';
  document.getElementById('dots').innerHTML = dots;
  document.getElementById('play-lbl').textContent = T('Jugar', 'Play');
  var pdf = document.getElementById('pdf');
  pdf.href = 'docs/' + T('ORBITAL-NEXUS-Presentacion-ES.pdf', 'ORBITAL-NEXUS-Presentation-EN.pdf');
  pdf.title = T('Descargar la presentación en PDF', 'Download the presentation as PDF');
  document.getElementById('fs-lbl').textContent = ' ' + T('Pantalla completa', 'Fullscreen');
  document.getElementById('hint').textContent = T('Usa ← → o desliza · toca una imagen para ampliarla', 'Use ← → or swipe · tap an image to enlarge it');
  go(I, true);
}

function go(i, quiet) {
  var all = document.querySelectorAll('.slide'), n = all.length;
  I = Math.max(0, Math.min(n - 1, i));
  for (var k = 0; k < n; k++) { all[k].classList.toggle('on', k === I); all[k].classList.toggle('prev', k < I); }
  all[I].scrollTop = 0;
  var d = document.querySelectorAll('.dot');
  for (k = 0; k < d.length; k++) d[k].classList.toggle('on', k === I);
  document.getElementById('count').textContent = (I + 1) + ' / ' + n;
  document.getElementById('prev').disabled = I === 0;
  document.getElementById('next').disabled = I === n - 1;
  if (!quiet) history.replaceState(null, '', '#' + (I + 1));
}

document.getElementById('prev').onclick = function () { go(I - 1); };
document.getElementById('next').onclick = function () { go(I + 1); };
document.getElementById('dots').onclick = function (e) { var b = e.target.closest('.dot'); if (b) go(+b.getAttribute('data-i')); };
document.getElementById('lang').onclick = function () { LANG = LANG === 'es' ? 'en' : 'es'; try { localStorage.setItem('on_lang', LANG); } catch (e) { } build(); };
document.getElementById('fs').onclick = function () {
  if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
document.addEventListener('keydown', function (e) {
  if (!document.getElementById('zoom').hidden) { if (e.key === 'Escape') document.getElementById('zoom').hidden = true; return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(I + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(I - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(99);
});
var tx = null, ty = null;
document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', function (e) {
  if (tx == null) return;
  var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(I + (dx < 0 ? 1 : -1));
  tx = null;
}, { passive: true });
document.getElementById('deck').addEventListener('click', function (e) {
  if (e.target.classList.contains('shot')) { var z = document.getElementById('zoom'); z.querySelector('img').src = e.target.src; z.querySelector('img').alt = e.target.alt; z.hidden = false; }
});
document.getElementById('zoom').onclick = function () { this.hidden = true; };
SpaceBG.start(document.getElementById('bg'), { base: function () { return '#0A1128'; }, paused: function () { return !document.getElementById('zoom').hidden; } });
var h = parseInt((location.hash || '').slice(1), 10);
if (h > 0) I = h - 1;
build();
</script>
